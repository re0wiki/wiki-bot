[project]
name = "wiki-bot"
version = "1.0.0"
description = "用于 Re:从零开始的异世界生活 Wiki 的一些脚本"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "opencc>=1.2.0",
    "tqdm>=4.67.3",
]

[tool.ruff]
# *.md：docs 内嵌代码块的注释对齐是手工排版的，不让 formatter 动。
# scripts/oneoff 是已完成任务的一次性脚本归档（不再运行，同 logs/ 的性质），
# 不要求其过 lint/format——否则每次归档新脚本都可能红 CI。
extend-exclude = ['pywikibot', 'logs', '*.md', 'scripts/oneoff']
# watchdog 由 Hermes cron 用 runpy 跑在 Hermes 自带的 Python 3.11 下（不走本
# 项目 3.14 venv），不能让它用上 PEP 758 的无括号 except（ruff 0.16+ 按
# requires-python 3.14 会把括号脱掉，脚本在 3.11 下直接起不来）。
per-file-target-version = { "scripts/recent_changes_watchdog.py" = "py311" }

[tool.ruff.lint.per-file-ignores]
# user-config.py 的名字由 pywikibot 注入；user-fixes.py 的 fixes 由
# pywikibot/fixes.py exec 本文件时注入（见其文件末尾 _load_file）。
"user-config.py" = ["F821"]
"user-fixes.py" = ["F821"]
# langs 等类属性字典是 pywikibot family 文件的既定写法。
"families/*.py" = ["RUF012"]

# ty 无法静态解析 PEP 660 editable finder，需显式把 submodule 根目录加入搜索路径
# （仅影响 import 解析）。exclude 控制检查范围：pywikibot 是上游代码，
# logs/ 是本地一次性脚本（已 gitignore），scripts/oneoff 是已归档的一次性脚本，
# 都不检查。
[tool.ty.environment]
extra-paths = ["./pywikibot", "./tests"]

[tool.ty.src]
exclude = ["pywikibot", "logs", "scripts/oneoff"]

[tool.uv]
default-groups = "all"

[tool.uv.sources]
pywikibot = { path = "pywikibot", editable = true }

[dependency-groups]
dev = [
    "pywikibot",
    "pytest>=8.0.0",
    "ruff>=0.15.1",
    "ty>=0.0.17",
]
pwb = [
    "beautifulsoup4>=4.14.3",
    "fake-useragent>=2.2.0",
    "googlesearch-python>=1.3.0",
    "memento-client==0.6.1",
    "mwoauth>=0.4.0",
    "mwparserfromhell>=0.7.2",
    "packaging>=25.0",
    "pillow==12.3.0; python_full_version == '3.9.*' and platform_python_implementation == 'PyPy'",
    "pillow==12.3.0; python_full_version == '3.10.*' and platform_python_implementation == 'PyPy'",
    "pillow==12.3.0; python_full_version == '3.9.*' and platform_python_implementation == 'CPython'",
    "pillow==12.3.0; python_full_version >= '3.11' and platform_python_implementation == 'PyPy'",
    "pillow>=12.1.0 ; python_full_version >= '3.10' and platform_python_implementation == 'CPython'",
    "pydot>=4.0.1",
    "pyjwt!=2.10.0,!=2.10.1",
    "pymysql>=1.1.2",
    "python-stdnum>=2.2",
    "requests>=2.32.3",
    "requests-sse>=0.5.2",
    "wikitextparser>=0.56.4",
]
