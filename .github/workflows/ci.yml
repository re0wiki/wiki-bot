name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # pywikibot 是 submodule 且经 [tool.uv.sources] 以 editable 装入，必须拉出
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run ty check
      # 离线单测；PYWIKIBOT_DIR 由 tests/conftest.py 设置
      - run: uv run pytest tests/ -q

  watchdog-py311:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      # 生产由 Hermes cron 以 Python 3.11 runpy 执行；隔离环境避免项目 >=3.14 约束
      - run: uv run --no-project --python 3.11 --with pytest --with requests pytest tests/test_watchdog.py -q
