name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # pywikibot 是 submodule 且经 [tool.uv.sources] 以 editable 装入，必须拉出
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      # --frozen：uv.lock 与 pyproject.toml 不一致时直接失败
      # .python-version (3.14) 由 uv 自动下载安装
      - run: uv sync --frozen

      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run ty check
      # 离线单测；PYWIKIBOT_DIR 由 tests/conftest.py 设置
      - run: uv run pytest tests/ -q
